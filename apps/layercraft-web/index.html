<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#15181e" />
  <title>LayerCraft — Pure-Rust 3D Slicer</title>
  <link data-trunk rel="copy-file" href="assets/icon.svg" />
  <link data-trunk rel="copy-file" href="assets/apple-touch-icon.png" />
  <link data-trunk rel="copy-file" href="assets/icon-192.png" />
  <link data-trunk rel="copy-file" href="assets/icon-512.png" />
  <link data-trunk rel="copy-file" href="assets/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #15181e; touch-action: none; overscroll-behavior: none; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="layercraft_canvas"></canvas>
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="layercraft-web" data-type="main" data-cargo-profile-release="wasm-release" data-wasm-opt="s" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals" />
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="slice_worker" data-type="worker" data-loader-shim data-bindgen-target="no-modules" data-cargo-profile-release="wasm-release" data-wasm-opt="s" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals" />
</body>
</html>
