[package]
name = "layercraft-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "layercraft-web"
path = "src/main.rs"

[[bin]]
name = "slice_worker"
path = "src/bin/slice_worker.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
js-sys.workspace = true
layercraft-engine.workspace = true
layercraft-slice.workspace = true
layercraft-ui-egui.workspace = true
layercraft-viewport-gpu.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "DedicatedWorkerGlobalScope", "MessageEvent", "Worker"] }
web-time.workspace = true
