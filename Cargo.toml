[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["LayerCraft contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[workspace.dependencies]
layercraft-geom = { path = "crates/geom" }
layercraft-clip = { path = "crates/clip" }
layercraft-mesh = { path = "crates/mesh" }
layercraft-config = { path = "crates/config" }
layercraft-slice = { path = "crates/slice" }
layercraft-gcode = { path = "crates/gcode" }
layercraft-io = { path = "crates/io" }
layercraft-engine = { path = "crates/engine" }
layercraft-viewport = { path = "crates/viewport" }
layercraft-viewport-gpu = { path = "crates/viewport-gpu" }
layercraft-ui-egui = { path = "crates/ui-egui" }
layercraft-mcp = { path = "crates/mcp" }
layercraft-testkit = { path = "crates/testkit" }

glam = "0.34"
robust = "1.2"
clipper2-rust = "1.2"
boostvoronoi = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = "1.2"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.23"

png = "0.18"
base64 = "0.23"
bytemuck = "1"
web-time = "1"
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false }
egui-wgpu = "0.37"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
rfd = "0.18"
